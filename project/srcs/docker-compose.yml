services:
  nginx:
    build:
      context: .
      dockerfile: requirements/nginx/Dockerfile

    container_name: nginx

    ports:
      - "443:443"

    secrets:
      - ssl_certificate
      - ssl_certificate_key

    networks:
      - inception

    volumes:
      - ./requirements/nginx/conf/:/etc/nginx/http.d/
      - wp_volume:/var/www/

    depends_on:
      - wordpress

    restart: always

  mariadb:
    build:
      context: .
      dockerfile: requirements/mariadb/Dockerfile

    container_name: mariadb

    ports:
      - "3306:3306"

    environment:
        DB_NAME: ${DB_NAME}
        DB_USER: ${DB_USER}

    secrets:
      - db_password
      - db_root_password

    networks:
      - inception

    volumes:
      - db_volume:/var/lib/mysql

    restart: always

#    healthcheck:
#      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "wordpress", "--password-file=/run/secrets/db_password"]
#      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
#      interval: 10s
#      timeout: 5s
#      retries: 3
#      start_period: 10s

  wordpress:
    build:
      context: .
      dockerfile: requirements/wordpress/Dockerfile
      args:
        - PHP_VERSION=${PHP_VERSION}

    container_name: wordpress

    environment:
        DB_NAME: ${DB_NAME}
        DB_USER: ${DB_USER}
        DB_HOST: ${DB_HOST}
        WP_ADMIN_URL: ${WP_ADMIN_URL}
        WP_ADMIN_TITLE: ${WP_ADMIN_TITLE}
        WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
        WP_USER_EMAIL: ${WP_USER_EMAIL}
        WP_USER_ROLE: ${WP_USER_ROLE}

    secrets:
      - db_password
      - wp_admin_user
      - wp_admin_password
      - wp_user
      - wp_user_password

    networks:
      - inception

    volumes:
      - wp_volume:/var/www/

    depends_on:
      mariadb:
        condition: service_started

    restart: always

volumes:
  wp_volume:
    name: wp_volume
    driver_opts:
      o: bind
      type: none
      device: /home/${USER}/data/wordpress

  db_volume:
    name: db_volume
    driver_opts:
      o: bind
      type: none
      device: /home/${USER}/data/mariadb

networks:
  inception:
    driver: bridge

secrets:
  ssl_certificate:
    file: /home/nefimov/project/secrets/nefimov.42.fr.crt

  ssl_certificate_key:
    file: /home/nefimov/project/secrets/nefimov.42.fr.key

  db_password:
    file: /home/nefimov/project/secrets/db_password.txt

  db_root_password:
    file: /home/nefimov/project/secrets/db_root_password.txt

  wp_admin_user:
    file: /home/nefimov/project/secrets/wp_admin_user.txt

  wp_admin_password:
    file: /home/nefimov/project/secrets/wp_admin_password.txt

  wp_user:
    file: /home/nefimov/project/secrets/wp_user.txt

  wp_user_password:
    file: /home/nefimov/project/secrets/wp_user_password.txt
